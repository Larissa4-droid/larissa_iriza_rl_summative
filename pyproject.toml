[project]
name = "larissa-iriza-rl-summative"
version = "0.1.0"
description = "Mission-based RL: a selling advisor for a rural Rwandan tomato cooperative (DQN, REINFORCE, PPO, A2C with TorchRL)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.7,<2.8",
    "torchrl==0.9.2",
    "tensordict==0.9.1",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pygame>=2.5",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[dependency-groups]
dev = ["pytest>=8"]

# CPU-only PyTorch: smaller download, works the same on Windows, macOS and Linux
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
